name: 七因子选股系统 - 每工作日自动扫描与发布

on:
  schedule:
    # 北京时间 15:35 = UTC 07:35，周一至周五
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 记录当前有效版本
        run: |
          git rev-parse HEAD > /tmp/before_scan_sha

      - name: 运行七因子扫描器（自动生成 docs/index.html）
        run: python3 scripts/seven_factor_scanner.py

      - name: 校验扫描结果
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          latest = Path('data/seven_factor_latest.json')
          valid = False
          total = 0
          count = 0

          try:
              data = json.loads(latest.read_text(encoding='utf-8'))
              total = int((data.get('summary') or {}).get('total_scanned', 0) or 0)
              count = len(data.get('candidates') or [])
              valid = total > 0 and count > 0
          except Exception as exc:
              print(f'无法解析扫描结果: {exc}')

          Path('/tmp/scan_valid').write_text('1' if valid else '0', encoding='utf-8')
          print(f'total_scanned={total}, candidates={count}, valid={valid}')
          PY

      - name: 无效扫描则恢复本次运行前的完整仓库状态
        if: ${{ hashFiles('/tmp/scan_valid') != '' }}
        run: |
          if [ "$(cat /tmp/scan_valid)" = "0" ]; then
            BEFORE_SHA=$(cat /tmp/before_scan_sha)
            echo "扫描无有效结果，恢复到 $BEFORE_SHA，不提交本次扫描。"
            git restore --source="$BEFORE_SHA" --worktree --staged -- data docs
            rm -f "data/seven_factor_$(date -u +%F).json"
          fi

      - name: 归档扫描结果 JSON
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            data/seven_factor_*.json
          retention-days: 30

      - name: 提交有效数据与网页到仓库
        run: |
          if [ "$(cat /tmp/scan_valid)" != "1" ]; then
            echo "空/无效扫描：保持原版本，不提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seven_factor_*.json data/concept_nodes_cache.json docs/index.html
          git diff --cached --quiet || git commit -m "auto: 扫描数据与网页 $(date -u +%Y-%m-%d)"
          git push
