name: 七因子选股系统 - 每工作日自动扫描与发布

on:
  schedule:
    # 北京时间 15:35 = UTC 07:35，周一至周五
    - cron: '35 7 * * 1-5'
  workflow_dispatch:  # 支持手动触发

# contents: write —— 允许提交数据与 docs/index.html 回 main 分支触发 Pages 发布
permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行七因子扫描器（自动生成 docs/index.html）
        run: python3 scripts/seven_factor_scanner.py

      - name: 归档扫描结果 JSON
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            data/seven_factor_*.json
          retention-days: 30

      - name: 提交数据与网页到仓库（触发 GitHub Pages 自动发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seven_factor_*.json data/concept_nodes_cache.json docs/index.html
          # 只在有变更时提交
          git diff --cached --quiet || git commit -m "auto: 扫描数据与网页 $(date +%Y-%m-%d)"
          git push
