name: 七因子选股系统 - 每工作日自动扫描与发布

on:
  schedule:
    # 北京时间 15:35 = UTC 07:35，周一至周五
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行七因子扫描器
        run: python3 scripts/seven_factor_scanner.py
      - name: 进一步筛选S级核心候选
        run: python3 scripts/refine_s_tier.py
      - name: 生成第三阶段决策页面（完整候选池）
        run: python3 scripts/generate_dashboard_full.py
      - name: 强制保持完整候选池展开
        run: python3 scripts/force_full_candidate_section.py
      - name: 导出每日候选池 Excel
        run: python3 scripts/export_candidate_pool_excel.py
      - name: 归档扫描结果 JSON
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            data/seven_factor_*.json
          retention-days: 30
      - name: 提交数据、网页与 Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seven_factor_*.json data/concept_nodes_cache.json data/candidate_pool_history.json data/candidate_pool_reviews/*.xlsx docs/index.html
          git diff --cached --quiet || git commit -m "auto: 扫描数据、页面与候选池复盘 $(date +%Y-%m-%d)"
          git push
