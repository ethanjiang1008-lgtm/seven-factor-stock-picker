name: 七因子选股系统 - 每工作日自动扫描与部署

on:
  schedule:
    # 北京时间 15:35 = UTC 07:35，周一至周五
    - cron: '35 7 * * 1-5'
  workflow_dispatch:  # 支持手动触发

# 权限：读代码 + 写 Actions artifacts + 回写扫描数据提交
permissions:
  contents: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行七因子扫描器（含自动 Netlify 部署）
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python3 scripts/seven_factor_scanner.py

      - name: 归档扫描结果 JSON
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            data/seven_factor_*.json
          retention-days: 30

      - name: 提交数据到仓库（保留历史归档）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seven_factor_*.json data/concept_nodes_cache.json
          # 只在有变更时提交
          git diff --cached --quiet || git commit -m "auto: 扫描数据 $(date +%Y-%m-%d)"
          git push
