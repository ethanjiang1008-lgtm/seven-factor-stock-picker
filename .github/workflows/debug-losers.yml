name: debug-losers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 测试新浪跌幅榜接口
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          H = {"Referer": "https://finance.sina.com.cn", "User-Agent": "Mozilla/5.0"}
          def get(url):
              r = urllib.request.Request(url, headers=H)
              return urllib.request.urlopen(r, timeout=15).read().decode("utf-8", "replace")
          base = "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData?page={p}&num=100&sort=changepercent&asc={a}&node=hs_a&symbol=&_s_r_a=sort"
          for label, p, a in [("losers p1 asc=1", 1, 1), ("losers p2 asc=1", 2, 1), ("gainers p1 asc=0", 1, 0)]:
              try:
                  text = get(base.format(p=p, a=a))
                  data = json.loads(text) if text.strip() else None
                  if not data:
                      print(f"[{label}] EMPTY/NULL raw={text[:100]!r}")
                      continue
                  chgs = [float(s.get("changepercent") or 0) for s in data]
                  downs = sum(1 for c in chgs if c <= -9.8)
                  print(f"[{label}] n={len(data)} min={min(chgs)} max={max(chgs)} limit_down={downs}")
                  print("  first3:", [(s["code"], s["name"], s["changepercent"]) for s in data[:3]])
              except Exception as e:
                  print(f"[{label}] ERROR {e}")
          EOF
