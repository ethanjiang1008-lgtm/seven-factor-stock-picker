name: 七因子系统 - 20:00 明日预判

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 北京时间20:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check candidate pool
        run: |
          python3 - <<'PY'
          import json
          with open('data/seven_factor_latest.json', encoding='utf-8') as f:
              d=json.load(f)
          n=len(d.get('candidates', []))
          print(f'candidate pool: {n}')
          if n == 0:
              raise SystemExit('candidate pool empty; abort evening analysis')
          PY

      - name: Run evening analysis
        run: python3 scripts/evening_analysis.py

      - name: Commit evening analysis only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/evening_latest.json
          git diff --cached --quiet || git commit -m "auto: evening analysis $(date +%Y-%m-%d)"
          git push
