name: 七因子系统 - 08:00 隔夜修正

on:
  schedule:
    - cron: '0 0 * * 0-4'  # 北京时间周一至周五08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check latest candidate pool
        run: |
          python3 - <<'PY'
          import json
          with open('data/seven_factor_latest.json', encoding='utf-8') as f:
              d=json.load(f)
          n=len(d.get('candidates', []))
          print(f'candidate pool: {n}')
          if not n:
              raise SystemExit('candidate pool empty; abort morning update')
          PY
      - name: Run morning update
        run: python3 scripts/morning_update.py
      - name: Refresh dashboard
        run: python3 scripts/generate_dashboard_v3_fixed.py
      - name: Commit morning data and dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/morning_latest.json docs/index.html
          git diff --cached --quiet || git commit -m "auto: morning update and dashboard $(date +%Y-%m-%d)"
          git push
