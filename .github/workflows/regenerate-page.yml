name: 七因子选股系统 - 页面重建

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_page.py'
      - 'data/seven_factor_latest.json'
      - 'data/seven_factor_*.json'
      - '.github/workflows/regenerate-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate page from existing latest data
        run: python3 scripts/generate_page.py

      - name: Commit generated page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "auto: regenerate decision dashboard"
          git push
