name: 七因子系统 - 页面重建

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_dashboard_v3.py'
      - 'scripts/generate_dashboard_v3_fixed.py'
      - 'scripts/generate_dashboard_full.py'
      - 'scripts/generate_dashboard_live.py'
      - 'scripts/patch_dashboard_paths.py'
      - 'scripts/force_full_candidate_section.py'
      - 'data/seven_factor_latest.json'
      - 'data/evening_latest.json'
      - 'data/morning_latest.json'
      - 'data/seven_factor_*.json'
      - '.github/workflows/regenerate-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate latest data
        run: |
          python3 - <<'PY'
          import json
          with open('data/seven_factor_latest.json', encoding='utf-8') as f:
              d=json.load(f)
          n=len(d.get('candidates', []))
          print(f'latest data OK: {n} candidates')
          if not n:
              raise SystemExit('latest candidate pool is empty; abort page regeneration')
          PY
      - name: Generate always-visible dashboard
        run: python3 scripts/generate_dashboard_live.py
      - name: Verify no fold / no lazy candidate pool
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html').read_text(encoding='utf-8')
          for x in ['④ 完整候选池','完整候选池自动读取']:
              assert x in p, f'missing expected marker: {x}'
          assert 'toggleFull' not in p, 'lazy toggle must not exist'
          assert 'lazy' not in p, 'lazy class must not exist'
          assert 'onclick' not in p, 'candidate pool must not require clicking'
          print('dashboard verified: full candidate pool is always visible')
          PY
      - name: Commit generated page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "auto: publish always-visible candidate dashboard"
          git push

# Updated to publish a no-fold dashboard after the user requested the full pool remain visible.
