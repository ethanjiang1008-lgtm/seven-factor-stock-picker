<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七因子 · 决策仪表盘</title><style>
:root{--bg:#0a0d12;--p:#121720;--p2:#171e28;--l:#283241;--t:#e8eef7;--m:#8792a4;--up:#ff6575;--down:#35d09a;--gold:#f5c85b;--blue:#6ea8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1480px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:20px}.title{font-size:27px;font-weight:900}.muted,small,.meta{color:var(--m)}.meta{text-align:right;font-size:11px;line-height:1.8}.hero,.layout,.pipeline{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}.box,.section{background:var(--p);border:1px solid var(--l);border-radius:15px}.box{padding:18px}.action{font-size:29px;font-weight:900}.metrics,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stats{grid-template-columns:1fr 1fr;padding:18px}.metric,.stat{padding:10px;background:#10151d;border:1px solid #222c38;border-radius:9px}.metric span,.stat span{display:block;color:var(--m);font-size:10px}.metric b,.stat b{display:block;margin-top:4px;font-size:17px}.stat b{font-size:25px}.up{color:var(--up)}.down{color:var(--down)}.gold{color:var(--gold)}.section{padding:16px;margin-top:14px}.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.focus{background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:13px}.rank{font-size:10px;color:var(--gold)}.fmain{display:grid;grid-template-columns:1fr 70px 42px;gap:8px;align-items:center;margin-top:5px}.fmain b{font-size:15px}.fmain small{display:block;font-size:9px;margin-top:3px}.fmain>strong{font-size:21px;text-align:right}.pill,.mini{display:inline-flex;padding:4px 7px;border-radius:6px;background:#202932;color:#c8d3e2;font-size:9px}.fm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:11px 0}.fm span{background:#10151d;border:1px solid #212b37;border-radius:7px;padding:7px;color:var(--m);font-size:9px}.fm b{display:block;color:var(--t);margin-top:3px}.watch{display:flex;gap:8px;background:#0f141b;border-radius:7px;padding:8px;font-size:10px}.watch span{color:var(--m)}.sector{display:grid;grid-template-columns:1fr 70px 130px;gap:8px;padding:9px 10px;background:#10151d;border:1px solid #212b37;border-radius:8px;margin-bottom:7px}.concepts{display:flex;flex-wrap:wrap;gap:7px}.concept{padding:8px 9px;background:#10151d;border:1px solid #212b37;border-radius:8px;font-size:10px}.concept em{font-style:normal;margin-left:6px;color:var(--up)}.pipeline{grid-template-columns:1fr 1fr}.pipeline-card{padding:14px;background:#10151d;border:1px solid #222c38;border-radius:10px}.pipeline-card h3{margin:0 0 8px;font-size:13px}.news{padding:8px 0;border-bottom:1px solid #222b36}.news b{display:block;font-size:10px}.news small{font-size:9px}.empty{padding:18px;text-align:center;color:var(--m);background:#0f141b;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{background:#0f141b;border:1px solid #273140;color:var(--t);padding:8px;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #222b36;text-align:left;font-size:10px}.table th{color:var(--m)}.table-wrap{max-height:760px;overflow:auto;border:1px solid #222c38;border-radius:10px}.footer{text-align:center;color:#5d6979;font-size:10px;padding:18px}@media(max-width:1000px){.hero,.layout,.pipeline{grid-template-columns:1fr}.focus-grid{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:12px}.top{flex-direction:column}.meta{text-align:left}.metrics,.stats{grid-template-columns:1fr 1fr}.fm{grid-template-columns:1fr 1fr}.sector{grid-template-columns:1fr 60px}.sector small{display:none}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">七因子 · 决策仪表盘</div><div class="muted">收盘选股 → 晚间预判 → 隔夜修正 → 竞价确认</div></div><div class="meta" id="meta">正在读取最新数据…</div></div><section class="hero"><div class="box"><div class="muted">当前市场状态</div><div class="action" id="action">读取中</div><div class="muted" id="sentiment">-</div><p class="muted" id="desc">-</p><div class="metrics" id="market"></div></div><div class="box stats" id="stats"></div></section><section class="section"><h2>① 明日重点观察</h2><p class="muted">七因子负责选股；这里看优先级与证据</p><div class="focus-grid" id="focus"></div></section><section class="section"><h2>② 主线与板块</h2><div class="layout"><div id="sectors"></div><div class="concepts" id="concepts"></div></div></section><section class="section"><h2>③ 晚间预判 / 隔夜修正</h2><div class="pipeline"><div class="pipeline-card"><h3>20:00 · 明日预判</h3><div id="evening"><div class="empty">等待20:00晚间信息更新。</div></div></div><div class="pipeline-card"><h3>08:00 · 隔夜修正</h3><div id="morning"><div class="empty">等待08:00隔夜信息更新。</div></div></div></div></section><section class="section"><h2>④ 完整候选池 <span class="muted" id="poolCount"></span></h2><p class="muted">完整候选池自动展示，不折叠、不需要点击。</p><div class="toolbar"><input id="q" placeholder="搜索股票 / 代码 / 板块"><select id="pool"><option>全部</option><option>重点观察</option><option>预备池</option><option>观察池</option><option>淘汰</option></select><select id="sort"><option value="score">调整分</option><option value="change">涨幅</option><option value="tier">优先级</option></select></div><div id="rows" class="table-wrap"><div class="empty">正在加载完整候选池…</div></div></section><div class="footer">七因子决策系统 · 仅供研究参考，不构成投资建议</div></div>
<script>
const BASE='https://raw.githubusercontent.com/ethanjiang1008-lgtm/seven-factor-stock-picker/main/data/';
let data={candidates:[]}, evening={}, morning={};
const $=id=>document.getElementById(id); const n=v=>Number(v||0);
function esc(v){return String(v==null?'-':v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}
function act(s){const x=n(s);if(x<40)return ['谨慎观察','市场偏弱，等待确认，不因为高分个股强行出手'];if(x<55)return ['轻仓试错','市场偏弱，优先等待主线与资金确认'];if(x<70)return ['结构性参与','围绕强板块挑核心，重点观察池优先'];return ['积极参与','市场进攻条件较好，优先主线核心与首板前候选']}
function renderPage(){const s=data.market_sentiment||{}, c=data.candidates||[];const [a,d]=act(s.sentiment_score);$('action').textContent=a;$('sentiment').textContent=`情绪分 ${n(s.sentiment_score).toFixed(1)} · ${esc(s.sentiment_label||'正常')}`;$('desc').textContent=d;$('meta').innerHTML=`扫描 ${esc(data.scan_date||'-')} ${esc(data.scan_time||'')}<br>20:00：${Object.keys(evening).length?'已生成':'尚未生成'}<br>08:00：${Object.keys(morning).length?'已生成':'尚未生成'}`;$('market').innerHTML=`<div class="metric"><span>涨停</span><b class="up">${esc(s.limit_up_count)}</b></div><div class="metric"><span>跌停</span><b class="down">${esc(s.limit_down_count)}</b></div><div class="metric"><span>最高连板</span><b>${esc(s.max_boards_est)}</b></div><div class="metric"><span>炸板率</span><b>${esc(s.explosion_rate)}%</b></div>`;const focus=c.filter(x=>x.pool==='重点观察').sort((a,b)=>n(b.adjusted_total)-n(a.adjusted_total)).slice(0,8);const ready=c.filter(x=>x.pool==='预备池').length,watch=c.filter(x=>x.pool==='观察池').length;$('stats').innerHTML=`<div class="stat"><span>重点观察</span><b>${focus.length}</b></div><div class="stat"><span>预备池</span><b>${ready}</b></div><div class="stat"><span>观察池</span><b>${watch}</b></div><div class="stat"><span>完整候选池</span><b>${c.length}</b></div>`;$('poolCount').textContent=`${c.length}只`;$('focus').innerHTML=focus.map((r,i)=>{const res=r.resonance||{},dots='●'.repeat(Math.min(3,n(res.count)))+'○'.repeat(Math.max(0,3-n(res.count)));const w=r.next_day_watch||['等待信号确认'];return `<article class="focus"><div class="rank">TOP ${i+1}</div><div class="fmain"><div><b>${esc(r.name)}</b><small>${esc(r.code)} · ${esc(r.sector||r.sw_industry)}</small></div><strong>${n(r.adjusted_total).toFixed(1)}</strong><span class="pill">P${esc((r.recency||{}).tier||'-')}</span></div><div class="fm"><span>三共振 <b class="gold">${dots}</b></span><span>连板概率 <b>${esc(r.lianban_probability)}%</b></span><span>涨幅 <b>${n(r.change_pct).toFixed(1)}%</b></span><span>换手 <b>${esc(r.turnover_rate)}%</b></span></div><div class="watch"><b>次日重点</b><span>${esc(w[0])}</span></div></article>`}).join('')||'<div class="empty">当前没有重点观察股。</div>';$('sectors').innerHTML=(data.sector_rankings||[]).slice().sort((a,b)=>n(b.avg_change)-n(a.avg_change)).slice(0,6).map(x=>`<div class="sector"><b>${esc(x.name)}</b><strong>${n(x.avg_change).toFixed(1)}%</strong><small>${esc(x.limit_up_count)}涨停 · ${esc(x.strong_count)}强势</small></div>`).join('');$('concepts').innerHTML=(data.concept_rankings||[]).slice().sort((a,b)=>n(b.avg_change)-n(a.avg_change)).slice(0,10).map(x=>`<span class="concept">#${esc(x.rank)} ${esc(x.name)} <em>${n(x.avg_change).toFixed(1)}%</em></span>`).join('');renderNews();renderRows()}
function renderNews(){const ev=evening.headlines||[],mo=morning.overnight_headlines||[];$('evening').innerHTML=ev.length?ev.slice(0,8).map(x=>`<div class="news"><b>${esc(x.title)}</b><small>${esc(x.pubDate)}</small></div>`).join(''):'<div class="empty">等待20:00晚间信息更新。</div>';$('morning').innerHTML=mo.length?mo.slice(0,8).map(x=>`<div class="news"><b>${esc(x.title)}</b><small>${esc(x.pubDate)}</small></div>`).join(''):'<div class="empty">等待08:00隔夜信息更新。</div>'}
function renderRows(){const q=($('q').value||'').toLowerCase(),p=$('pool').value,s=$('sort').value;let a=(data.candidates||[]).filter(r=>(p==='全部'||r.pool===p)&&(!q||`${r.name||''} ${r.code||''} ${r.sector||''} ${r.sw_industry||''}`.toLowerCase().includes(q)));a.sort((x,y)=>s==='change'?n(y.change_pct)-n(x.change_pct):s==='tier'?n((x.recency||{}).tier||99)-n((y.recency||{}).tier||99):n(y.adjusted_total)-n(x.adjusted_total));$('rows').innerHTML=`<table class="table"><thead><tr><th>#</th><th>股票</th><th>池</th><th>P</th><th>调整分</th><th>涨幅</th><th>三共振</th></tr></thead><tbody>${a.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b><br><small>${esc(r.code)} · ${esc(r.sector||r.sw_industry)}</small></td><td>${esc(r.pool)}</td><td>P${esc((r.recency||{}).tier||'-')}</td><td>${n(r.adjusted_total).toFixed(1)}</td><td>${n(r.change_pct).toFixed(1)}%</td><td>${esc((r.resonance||{}).count||0)}/3</td></tr>`).join('')}</tbody></table>`}
['q','pool','sort'].forEach(id=>$(id).addEventListener('input',renderRows));
Promise.all([fetch(BASE+'seven_factor_latest.json').then(r=>r.json()),fetch(BASE+'evening_latest.json').then(r=>r.json()).catch(()=>({})),fetch(BASE+'morning_latest.json').then(r=>r.json()).catch(()=>({}))]).then(([d,e,m])=>{data=d;evening=e;morning=m;renderPage()}).catch(()=>{$('rows').innerHTML='<div class="empty">最新候选池读取失败，请稍后刷新。</div>'});
</script></body></html>
